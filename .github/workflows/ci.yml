name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (skip tests)
        run: mvn -B package -DskipTests

      - name: Smoke-run with in-memory H2
        run: |
          java -jar target/resumeforge-*.jar &
          sleep 20
          curl -sf http://localhost:8080/login > /dev/null && echo "APP BOOTS OK"
          curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/ | grep -q "200" && echo "LANDING OK"
