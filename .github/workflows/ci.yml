name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (skip tests)
        run: mvn -B package -DskipTests

      - name: Smoke-run with in-memory H2
        env:
          RESUMEFORCE_DB: h2
        run: |
          java -jar target/resumeforge-*.jar > boot.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/login; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" = "1" ]; then echo "APP BOOTS OK"; else echo "APP FAILED TO BOOT"; cat boot.log; exit 1; fi
          kill $APP_PID 2>/dev/null || true
