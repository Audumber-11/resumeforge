# ============================================
# ResumeForge - Application Configuration
# ============================================

# Server
server.port=8080
spring.application.name=ResumeForge

# Thymeleaf
spring.thymeleaf.cache=false

# ── Default: MySQL Database (persistent) ──
# Falls back to in-memory H2 only when MySQL is unavailable (set RESUMEFORCE_DB=h2 to force H2).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resumeforge?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:resumeforge}
spring.datasource.password=${DB_PASSWORD:}

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── H2 Console: DISABLED (security hardening) ──
spring.h2.console.enabled=false

# ── File Upload ──
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── Security ──
# Default boot user for actuator-style endpoints; change via env in production
spring.security.user.name=${SECURITY_USER:admin}
spring.security.user.password=${SECURITY_PASSWORD:changeme}

# Session timeout (30 minutes)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=false
server.error.include-stacktrace=never
server.error.include-message=never

# ── PDF Generation ──
resumeforge.pdf.output-dir=./generated-pdfs

# ── AI Configuration (OpenRouter) ──
# Get a free key at https://openrouter.ai/keys and set OPENROUTER_API_KEY (never commit real keys)
resumeforge.ai.provider=openrouter
resumeforge.ai.api-key=${OPENROUTER_API_KEY:}
resumeforge.ai.model=nvidia/nemotron-3-super-120b-a12b:free
resumeforge.ai.base-url=https://openrouter.ai/api/v1
resumeforge.ai.max-tokens=2000
resumeforge.ai.temperature=0.3
