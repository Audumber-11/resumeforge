<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ResumeForge</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container">
        <a href="/" class="navbar-brand">
            <div class="brand-icon">R</div>
            ResumeForge
        </a>
        <div class="navbar-nav">
            <a th:href="@{/dashboard}" class="active">Dashboard</a>
            <a th:href="@{/profile}">Profile</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-secondary btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<!-- Dashboard Content -->
<div class="dashboard">
    <div class="container">

        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success animate-in">
            <span>&#10003;</span> <span th:text="${successMessage}"></span>
        </div>

        <!-- Header -->
        <div class="dashboard-header">
            <div>
                <h2>Welcome, <span th:text="${user.fullName}">User</span> &#128075;</h2>
                <p class="text-muted" style="margin-top: 4px;">Manage your resumes and track your progress.</p>
            </div>
            <form th:action="@{/dashboard/create}" method="post" style="display:flex; gap:8px;">
                <input type="text" name="title" class="form-control" placeholder="Resume title..."
                       style="width: 240px;" required>
                <button type="submit" class="btn btn-primary">+ Create New Resume</button>
            </form>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: var(--primary-light); color: var(--primary);">&#128196;</div>
                <div>
                    <div class="stat-value" th:text="${totalResumes}">0</div>
                    <div class="stat-label">Total Resumes</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #ecfdf5; color: #10b981;">&#9998;</div>
                <div>
                    <div class="stat-value" th:text="${#lists.size(resumes)}">0</div>
                    <div class="stat-label">Recent</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #fffbeb; color: #f59e0b;">&#128276;</div>
                <div>
                    <div class="stat-value" th:text="${user.fullName}">User</div>
                    <div class="stat-label">Account</div>
                </div>
            </div>
        </div>

        <!-- Resume List -->
        <h3 style="margin-bottom: 16px;">Your Resumes</h3>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(resumes)}" class="empty-state">
            <div class="icon">&#128196;</div>
            <h3>No resumes yet</h3>
            <p style="margin: 8px 0 20px;">Create your first resume to get started.</p>
            <form th:action="@{/dashboard/create}" method="post">
                <input type="hidden" name="title" value="My First Resume">
                <button type="submit" class="btn btn-primary">+ Create Your First Resume</button>
            </form>
        </div>

        <!-- Resume Grid -->
        <div class="resume-grid">
            <div th:each="resume : ${resumes}" class="resume-card animate-in">
                <div class="resume-card-title" th:text="${resume.title}">Untitled</div>
                <div class="resume-card-meta">
                    <span th:text="${resume.templateId}">professional</span> &middot;
                    Updated <span th:text="${#temporals.format(resume.updatedAt, 'MMM dd, yyyy')}">just now</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                    <div class="progress-bar" style="flex: 1;">
                        <div class="progress-fill" style="width: 30%;"></div>
                    </div>
                    <span class="text-sm text-muted">30%</span>
                </div>
                <div class="resume-card-actions">
                    <a th:href="@{/builder/{id}(id=${resume.id})}" class="btn btn-primary btn-sm">Open</a>
                    <form th:action="@{/dashboard/duplicate/{id}(id=${resume.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-secondary btn-sm">Duplicate</button>
                    </form>
                    <a th:href="@{/resume/{id}/pdf(id=${resume.id})}" class="btn btn-secondary btn-sm">PDF</a>
                    <form th:action="@{/dashboard/delete/{id}(id=${resume.id})}" method="post" style="display:inline;"
                          onsubmit="return confirm('Are you sure you want to delete this resume?');">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
