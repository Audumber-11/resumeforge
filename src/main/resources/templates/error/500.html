<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - ResumeForge</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar"><div class="container"><a th:href="@{/}" class="navbar-brand"><div class="brand-icon">R</div> ResumeForge</a></div></nav>
<div style="text-align:center; padding:100px 24px;">
    <div style="font-size:5rem; margin-bottom:16px;">500</div>
    <h2>Something went wrong</h2>
    <p style="margin: 12px 0 24px; color: var(--gray-500);" th:text="${errorMessage} ?: 'An unexpected error occurred.'">Error</p>
    <a th:href="@{/}" class="btn btn-primary">Go Home</a>
</div>

</html>
