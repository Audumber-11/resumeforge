<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ResumeForge</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container">
        <a th:href="@{/dashboard}" class="navbar-brand">
            <div class="brand-icon">R</div>
            ResumeForge
        </a>
        <div class="navbar-nav">
            <a th:href="@{/dashboard}">Dashboard</a>
            <a th:href="@{/profile}" class="active">Profile</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-secondary btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div style="max-width: 700px; margin: 40px auto; padding: 0 24px;">

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success animate-in">
        <span>&#10003;</span> <span th:text="${successMessage}"></span>
    </div>

    <div class="card">
        <div class="profile-header">
            <div class="profile-avatar" th:text="${#strings.substring(user.fullName, 0, 1)}">A</div>
            <div>
                <h2 th:text="${user.fullName}">User</h2>
                <p class="text-muted" th:text="'@' + ${user.username}">@username</p>
            </div>
        </div>

        <form th:action="@{/profile/update}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" th:value="${user.username}" disabled>
                    <div class="form-text">Username cannot be changed.</div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" th:value="${user.email}" disabled>
                    <div class="form-text">Email cannot be changed.</div>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" name="phone" class="form-control" th:value="${user.phone}" placeholder="Enter phone number">
                </div>
            </div>

            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" class="form-control" th:value="${user.location}" placeholder="e.g. Mumbai, India">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Member Since</label>
                    <input type="text" class="form-control" th:value="${#temporals.format(user.createdAt, 'MMMM dd, yyyy')}" disabled>
                </div>
                <div class="form-group">
                    <label>Account Status</label>
                    <input type="text" class="form-control" value="Active" disabled>
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
